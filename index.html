<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CLT Field Simulator</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main class="app-shell" id="appShell">
      <section class="sim-stage" aria-label="CLT magnetic field simulator">
        <div class="topbar">
          <div>
            <p class="eyebrow">Charlotte Magnetic Field</p>
            <h1>CLT Field Simulator</h1>
          </div>
          <div class="stage-actions">
            <button id="menuToggleButton" class="icon-button glass-button" type="button" aria-label="Hide controls menu" title="Hide controls menu">
              ×
            </button>
            <div class="status-chip" id="polarityStatus">Polarity stable</div>
            <button id="fullscreenButton" class="icon-button glass-button" type="button" aria-label="Toggle fullscreen viewer" title="Toggle fullscreen viewer">
              ⛶
            </button>
          </div>
        </div>
        <canvas id="scene" aria-label="3D CLT field visualization"></canvas>
        <div class="scale-note" id="scaleNote">Scaled view</div>
      </section>

      <aside class="control-panel" aria-label="Simulator controls">
        <section class="panel-section">
          <div class="section-heading">
            <h2>Field Inputs</h2>
            <button id="resetButton" class="icon-button" type="button" aria-label="Reset simulator" title="Reset simulator">
              ↺
            </button>
          </div>

          <label class="control-row">
            <span>CLT</span>
            <input id="cltInput" type="text" inputmode="decimal" value="1000" />
          </label>

          <label class="control-row">
            <span>M-band radius</span>
            <div class="unit-input">
              <input id="mBandInput" type="text" inputmode="decimal" value="4" />
              <small>m</small>
            </div>
          </label>

          <label class="control-row">
            <span>Rotation</span>
            <div class="range-pair">
              <input id="rpmRange" type="range" min="0" max="350" step="0.1" value="120" />
              <div class="unit-input compact">
                <input id="rpmInput" type="text" inputmode="decimal" value="120" />
                <small>rpm</small>
              </div>
            </div>
          </label>

          <label class="control-row">
            <span>Polarity flips</span>
            <div class="range-pair with-action">
              <input id="flipsRange" type="range" min="0" max="10" step="0.1" value="0.3" />
              <div class="unit-input compact">
                <input id="flipsInput" type="text" inputmode="decimal" value="0.3" />
                <small>/min</small>
              </div>
              <button id="flipNowButton" class="icon-button" type="button" aria-label="Flip polarity now" title="Flip polarity now">
                ⇅
              </button>
            </div>
          </label>

          <label class="control-row">
            <span>Axial tilt</span>
            <div class="range-pair">
              <input id="tiltRange" type="range" min="-45" max="45" step="0.1" value="13" />
              <div class="unit-input compact">
                <input id="tiltInput" type="text" inputmode="decimal" value="13" />
                <small>deg</small>
              </div>
            </div>
          </label>
        </section>

        <section class="panel-section readout-grid" aria-label="Live readouts">
          <div class="readout">
            <span>Microtesla</span>
            <strong id="microteslaReadout">7.25 μT</strong>
          </div>
          <div class="readout">
            <span>Tungsten</span>
            <strong id="tungstenReadout">0.09 mg/m³</strong>
          </div>
          <div class="readout">
            <span>Field scale</span>
            <strong id="fieldScaleReadout">MH R 26.0 m</strong>
          </div>
          <div class="readout">
            <span>Model height</span>
            <strong>1.6 m</strong>
          </div>
          <div class="readout">
            <span>Viewer band</span>
            <strong id="viewerBandReadout">M</strong>
          </div>
          <div class="readout">
            <span>Local CLT</span>
            <strong id="localCltReadout">1,000 CLT</strong>
          </div>
        </section>

        <section class="panel-section">
          <h2>Band Colors</h2>
          <div class="legend" id="legend"></div>
        </section>
      </aside>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
